<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f472b6" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KittyNutri" />
  <title>KittyNutri • Makros, Zyklus & Glow</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* Default Theme: Strawberry Milk */
      --bg-base: #fdf2f7;
      --bg-grad: radial-gradient(circle at 50% 0%, #ffe4f0 0%, #fdf2f7 70%);
      --orb-1: #f472b6;
      --orb-2: #fb7185;
      --orb-3: #e879f9;
      --glass-bg: linear-gradient(155deg, rgba(255, 255, 255, 0.80) 0%, rgba(255, 240, 247, 0.72) 100%);
      --glass-subtle: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(244, 114, 182, 0.25);
      --glass-shadow: 0 12px 32px -10px rgba(219, 39, 119, 0.16), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
      --dock-bg: rgba(255, 245, 250, 0.86);
      --modal-bg: linear-gradient(180deg, rgba(255, 248, 252, 0.97) 0%, rgba(253, 232, 243, 0.98) 100%);
      --header-bg: rgba(253, 242, 247, 0.78);
      --text-main: #4a152f;
      --text-muted: #8c4a6b;
      --text-soft: #b06e8e;
      --accent: #ec4899;
      --accent-2: #f43f5e;
      --accent-soft: rgba(236, 72, 153, 0.14);
      --input-bg: rgba(255, 255, 255, 0.75);
      --bar-track: rgba(236, 72, 153, 0.12);
    }

    /* Theme 2: Sakura Blossom */
    [data-theme="sakura"] {
      --bg-base: #fff5f9;
      --bg-grad: radial-gradient(circle at 50% 0%, #fce7f3 0%, #f5d0fe 45%, #fff5f9 85%);
      --orb-1: #f9a8d4;
      --orb-2: #d8b4fe;
      --orb-3: #fda4af;
      --glass-bg: linear-gradient(155deg, rgba(255, 255, 255, 0.84) 0%, rgba(250, 232, 255, 0.70) 100%);
      --glass-subtle: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(217, 70, 239, 0.22);
      --glass-shadow: 0 12px 32px -10px rgba(192, 38, 211, 0.14), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
      --dock-bg: rgba(255, 248, 253, 0.88);
      --modal-bg: linear-gradient(180deg, rgba(255, 250, 254, 0.97) 0%, rgba(250, 232, 255, 0.98) 100%);
      --header-bg: rgba(255, 245, 249, 0.80);
      --text-main: #4c1d4b;
      --text-muted: #864d84;
      --text-soft: #a873a6;
      --accent: #d946ef;
      --accent-2: #ec4899;
      --accent-soft: rgba(217, 70, 239, 0.14);
      --input-bg: rgba(255, 255, 255, 0.80);
      --bar-track: rgba(217, 70, 239, 0.12);
    }

    /* Theme 3: Y2K Hot Berry */
    [data-theme="y2k"] {
      --bg-base: #ffe4f1;
      --bg-grad: radial-gradient(circle at 20% 0%, #fbcfe8 0%, #f9a8d4 45%, #ffe4f1 90%);
      --orb-1: #db2777;
      --orb-2: #e11d48;
      --orb-3: #f43f5e;
      --glass-bg: linear-gradient(155deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 228, 242, 0.72) 100%);
      --glass-subtle: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(219, 39, 119, 0.28);
      --glass-shadow: 0 14px 34px -10px rgba(219, 39, 119, 0.24), inset 0 1px 0 0 rgba(255, 255, 255, 0.92);
      --dock-bg: rgba(255, 235, 245, 0.88);
      --modal-bg: linear-gradient(180deg, rgba(255, 242, 248, 0.97) 0%, rgba(252, 213, 233, 0.98) 100%);
      --header-bg: rgba(255, 228, 241, 0.80);
      --text-main: #500724;
      --text-muted: #831843;
      --text-soft: #9d174d;
      --accent: #db2777;
      --accent-2: #e11d48;
      --accent-soft: rgba(219, 39, 119, 0.16);
      --input-bg: rgba(255, 255, 255, 0.76);
      --bar-track: rgba(219, 39, 119, 0.15);
    }

    /* Theme 4: Velvet Rose Dark (Night Mode) */
    [data-theme="velvet"] {
      --bg-base: #14070e;
      --bg-grad: radial-gradient(circle at 50% 0%, #2d0f20 0%, #14070e 72%);
      --orb-1: #ec4899;
      --orb-2: #e11d48;
      --orb-3: #c026d3;
      --glass-bg: linear-gradient(155deg, rgba(56, 20, 40, 0.66) 0%, rgba(28, 10, 20, 0.78) 100%);
      --glass-subtle: rgba(255, 192, 224, 0.07);
      --glass-border: rgba(244, 114, 182, 0.22);
      --glass-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.75), inset 0 1px 0 0 rgba(255, 210, 232, 0.16);
      --dock-bg: rgba(26, 9, 18, 0.86);
      --modal-bg: linear-gradient(180deg, rgba(42, 14, 29, 0.96) 0%, rgba(20, 7, 14, 0.98) 100%);
      --header-bg: rgba(20, 7, 14, 0.78);
      --text-main: #fff1f7;
      --text-muted: #f9a8d4;
      --text-soft: #d884af;
      --accent: #f472b6;
      --accent-2: #fb7185;
      --accent-soft: rgba(244, 114, 182, 0.18);
      --input-bg: rgba(0, 0, 0, 0.35);
      --bar-track: rgba(255, 255, 255, 0.10);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Quicksand', 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--bg-grad);
    }
    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(85px);
      opacity: 0.36;
      animation: floatOrb 16s ease-in-out infinite alternate;
    }
    .orb-1 { width: 270px; height: 270px; top: -60px; left: -50px; background: var(--orb-1); }
    .orb-2 { width: 250px; height: 250px; top: 30%; right: -70px; background: var(--orb-2); animation-delay: -5s; }
    .orb-3 { width: 230px; height: 230px; bottom: 8%; left: 8%; background: var(--orb-3); opacity: 0.26; animation-delay: -10s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 28px) scale(1.08); }
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    .glass-subtle {
      background: var(--glass-subtle);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
    }
    .glass-pill {
      background: var(--glass-subtle);
      border: 1px solid var(--glass-border);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-pill:active { transform: scale(0.96); }
    .glass-dock {
      background: var(--dock-bg);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    .glass-modal {
      background: var(--modal-bg);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-top: 1px solid var(--glass-border);
      color: var(--text-main);
    }
    .theme-input {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
    }
    .theme-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .bar-track { background: var(--bar-track); }
    .text-main { color: var(--text-main); }
    .text-muted { color: var(--text-muted); }
    .text-soft { color: var(--text-soft); }
    .text-accent { color: var(--accent); }
    .bg-accent-soft { background: var(--accent-soft); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    .tab-view { animation: fadeSlideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes kawaiiBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2.5px) rotate(2deg); }
    }
    .kitty-float { animation: kawaiiBounce 3.2s ease-in-out infinite; }

    #qr-reader { border: none !important; border-radius: 16px; overflow: hidden; }
    #qr-reader video { border-radius: 16px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Main App Shell -->
  <div class="relative z-10 max-w-[480px] mx-auto min-h-[100dvh] flex flex-col pb-28">
    
    <!-- Top Sticky Kawaii Glass Header -->
    <header style="background: var(--header-bg); border-color: var(--glass-border);" class="sticky top-0 z-30 px-4 pt-[calc(10px+var(--safe-top))] pb-3 backdrop-blur-xl border-b">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <!-- Kawaii Bow-Kitty Mascot Badge -->
          <div class="w-10 h-10 rounded-2xl glass-card flex items-center justify-center shrink-0 kitty-float" id="headerKittyIcon"></div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-sm font-extrabold tracking-tight text-main">KittyNutri</h1>
              <span id="phaseBadge" onclick="cycleGoalMode()" class="cursor-pointer text-[10px] font-bold px-2 py-0.5 rounded-full bg-accent-soft text-accent border border-pink-400/30">
                Recomp • 2250
              </span>
            </div>
            <div class="flex items-center gap-1.5 mt-0.5">
              <button onclick="shiftDate(-1)" class="text-muted hover:text-accent text-xs px-1 font-bold">◀</button>
              <span id="currentDateLabel" class="text-[11px] font-bold text-muted">Heute</span>
              <button onclick="shiftDate(1)" class="text-muted hover:text-accent text-xs px-1 font-bold">▶</button>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Theme Switcher Button -->
          <button onclick="cycleTheme()" id="themeBtn" title="Pink Theme wechseln" class="glass-pill px-2.5 py-2 rounded-2xl text-xs font-bold text-main flex items-center gap-1">
            🎀
          </button>
          <!-- Quick Log Button -->
          <button onclick="openQuickLogModal()" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="px-3 py-2 rounded-2xl flex items-center gap-1 text-xs font-extrabold text-white shadow-md active:scale-95 transition-transform">
            <span class="text-sm leading-none">+</span> Log
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Viewport -->
    <main id="appViewport" class="flex-1 px-4 pt-4 space-y-4"></main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2">
      <div class="glass-card px-4 py-2.5 rounded-2xl text-xs font-bold text-main flex items-center gap-2 shadow-xl">
        <span id="toastIcon">🎀</span>
        <span id="toastText">Gespeichert</span>
      </div>
    </div>

    <!-- Floating Bottom Glass Dock (5 Tabs incl. Zyklus!) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 px-3 pb-[calc(10px+var(--safe-bottom))] pt-2 pointer-events-none">
      <div class="max-w-[456px] mx-auto glass-dock rounded-[26px] p-1.5 grid grid-cols-5 gap-1 pointer-events-auto">
        <button onclick="switchTab('today')" data-tab="today" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl text-[10px] font-bold transition-all">
          <span class="text-base leading-none mb-0.5">🏠</span>
          Heute
        </button>
        <button onclick="switchTab('cycle')" data-tab="cycle" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl text-[10px] font-bold transition-all">
          <span class="text-base leading-none mb-0.5">🌸</span>
          Zyklus
        </button>
        <button onclick="switchTab('scan')" data-tab="scan" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl text-[10px] font-bold transition-all">
          <span class="text-base leading-none mb-0.5">📷</span>
          Scan
        </button>
        <button onclick="switchTab('supps')" data-tab="supps" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl text-[10px] font-bold transition-all">
          <span class="text-base leading-none mb-0.5">💊</span>
          Supps
        </button>
        <button onclick="switchTab('presets')" data-tab="presets" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl text-[10px] font-bold transition-all">
          <span class="text-base leading-none mb-0.5">🎀</span>
          1-Klick
        </button>
      </div>
    </nav>
  </div>

  <!-- Modal Container -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 bg-black/55 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeModalOnBackdrop(event)">
    <div id="modalSheet" class="glass-modal w-full max-w-[480px] rounded-t-[30px] sm:rounded-[30px] max-h-[88dvh] overflow-y-auto p-5 pb-[calc(24px+var(--safe-bottom))] shadow-2xl"></div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          cycle: { ...DEFAULT_STATE.cycle, ...(parsed.cycle || {}) },
          activeTab: parsed.activeTab || 'today',
          selectedDate: parsed.selectedDate || getTodayISO(0)
        };
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function applyTheme(themeId) {
      document.documentElement.setAttribute('data-theme', themeId === 'strawberry' ? '' : themeId);
      const tObj = THEMES.find(t => t.id === themeId) || THEMES[0];
      const meta = document.getElementById('metaThemeColor');
      if (meta) meta.setAttribute('content', tObj.metaColor);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = `${tObj.emoji} <span class="hidden sm:inline">${tObj.name.split(' ')[0]}</span>`;
    }

    function cycleTheme() {
      const idx = THEMES.findIndex(t => t.id === state.theme);
      const next = THEMES[(idx + 1) % THEMES.length];
      state.theme = next.id;
      saveState();
      applyTheme(state.theme);
      render();
      showToast(`Theme: ${next.name}`, next.emoji);
    }

    // =========================================================================
    // 7. CYCLE PHASE ENGINE (4 PHASES)
    // =========================================================================
    function getCycleStatusForDate(dateISO = state.selectedDate) {
      const start = new Date(state.cycle.lastPeriodStart + 'T12:00:00');
      const current = new Date(dateISO + 'T12:00:00');
      const diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24));
      const len = Math.max(21, Math.min(40, Number(state.cycle.cycleLength) || 28));
      const pLen = Math.max(2, Math.min(9, Number(state.cycle.periodLength) || 5));

      // Modulo cycle day (1..len)
      const cycleDay = (((diffDays % len) + len) % len) + 1;
      const ovulationDay = Math.max(pLen + 3, len - 14);

      let phase;
      if (cycleDay <= pLen) {
        phase = CYCLE_PHASES[0]; // Menstruation
      } else if (cycleDay < ovulationDay - 1) {
        phase = CYCLE_PHASES[1]; // Follicular
      } else if (cycleDay <= ovulationDay + 1) {
        phase = CYCLE_PHASES[2]; // Ovulation
      } else {
        phase = CYCLE_PHASES[3]; // Luteal
      }

      const daysUntilPeriod = len - cycleDay + 1;
      return { cycleDay, len, pLen, phase, daysUntilPeriod };
    }

    function getActiveGoals(dateISO = state.selectedDate) {
      const base = { ...state.goals[state.goalMode] };
      const cStatus = getCycleStatusForDate(dateISO);
      if (state.autoLutealBonus && cStatus.phase.id === 'luteal') {
        base.kcal += 150;
        base.kh += 25;
        base.f += 5;
        base.lutealActive = true;
      }
      return base;
    }

    function getDayData(dateISO = state.selectedDate) {
      if (!state.days[dateISO]) {
        state.days[dateISO] = {
          entries: [],
          supps: {
            esn_d3k2: false,
            dh_haar: false,
            dh_reizdarm: false
          },
          d3Caps: 1,
          waterMl: 0,
          cycleMood: null,
          cycleSymptom: null
        };
      }
      return state.days[dateISO];
    }

    function getFoodById(id) {
      return state.foods.find(f => f.id === id);
    }

    function calcItemNutrition(food, qty) {
      if (!food) return { kcal: 0, p: 0, kh: 0, f: 0, fib: 0, micro: {} };
      const factor = food.isUnit ? qty : (qty / 100);
      const m = food.micro || {};
      return {
        kcal: food.kcal * factor,
        p: food.p * factor,
        kh: food.kh * factor,
        f: food.f * factor,
        fib: (food.fib || 0) * factor,
        micro: {
          d3: (m.d3 || 0) * factor,
          k2: (m.k2 || 0) * factor,
          mg: (m.mg || 0) * factor,
          fe: (m.fe || 0) * factor,
          zn: (m.zn || 0) * factor,
          ca: (m.ca || 0) * factor,
          b12: (m.b12 || 0) * factor,
          biotin: (m.biotin || 0) * factor
        }
      };
    }

    function calcDayTotals(dateISO = state.selectedDate) {
      const day = getDayData(dateISO);
      const totals = {
        kcal: 0, p: 0, kh: 0, f: 0, fib: 0,
        micro: { d3: 0, k2: 0, mg: 0, fe: 0, zn: 0, ca: 0, b12: 0, biotin: 0 }
      };

      day.entries.forEach(entry => {
        const food = getFoodById(entry.foodId);
        const n = calcItemNutrition(food, entry.qty);
        totals.kcal += n.kcal;
        totals.p += n.p;
        totals.kh += n.kh;
        totals.f += n.f;
        totals.fib += n.fib;
        Object.keys(totals.micro).forEach(k => {
          totals.micro[k] += (n.micro[k] || 0);
        });
      });

      GIRL_SUPPS.forEach(s => {
        if (day.supps[s.id]) {
          const mult = s.hasDoseStepper ? (day.d3Caps || 1) : 1;
          Object.keys(totals.micro).forEach(k => {
            totals.micro[k] += (s.micro[k] || 0) * mult;
          });
        }
      });

      return totals;
    }

    // =========================================================================

    function showToast(text, icon = '🎀') {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = text;
      document.getElementById('toastIcon').textContent = icon;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function formatDateLabel(dateISO) {
      const today = getTodayISO(0);
      const yesterday = getTodayISO(-1);
      if (dateISO === today) return 'Heute';
      if (dateISO === yesterday) return 'Gestern';
      const [y, m, d] = dateISO.split('-');
      return `${d}.${m}.${y}`;
    }

    function shiftDate(delta) {
      const d = new Date(state.selectedDate + 'T12:00:00');
      d.setDate(d.getDate() + delta);
      state.selectedDate = d.toISOString().split('T')[0];
      saveState();
      render();
    }

    function cycleGoalMode() {
      const order = ['recomp', 'cut', 'bulk'];
      const next = order[(order.indexOf(state.goalMode) + 1) % order.length];
      state.goalMode = next;
      saveState();
      render();
      const g = getActiveGoals();
      showToast(`Ziel: ${g.label} (${g.kcal} kcal)`, '✨');
    }

      state.activeTab = tab;
      saveState();

      render();
      showToast(`${qty} ${food.unit} ${food.name} geloggt`, '🍓');
    }

    function applyPreset(presetId) {
      const preset = state.presets.find(p => p.id === presetId);
      if (!preset) return;
      const day = getDayData();
      preset.items.forEach((item, idx) => {
        const food = getFoodById(item.foodId);
        if (food) {
          day.entries.push({
            id: 'ent_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 5),
            foodId: item.foodId,
            qty: Number(item.qty),
            groupLabel: preset.name
          });
        }
      });
      saveState();
      render();
      showToast(`${preset.icon} ${preset.name} geloggt!`, '🎀');
    }

    function updateEntryQty(entryId, deltaOrValue, isAbsolute = false) {
      const day = getDayData();
      const entry = day.entries.find(e => e.id === entryId);
      if (!entry) return;
      const food = getFoodById(entry.foodId);
      const step = food?.isUnit ? 0.5 : 5;
      if (isAbsolute) {
        const val = parseFloat(deltaOrValue);
        if (!isNaN(val) && val > 0) entry.qty = val;
      } else {
        entry.qty = Math.max(step, Math.round((entry.qty + deltaOrValue) * 10) / 10);
      }
      saveState();
      render();
    }

    function removeEntry(entryId) {
      const day = getDayData();
      day.entries = day.entries.filter(e => e.id !== entryId);
      saveState();
      render();
      showToast('Eintrag entfernt', '🗑️');
    }

    function addWater(ml) {
      const day = getDayData();
      day.waterMl = Math.max(0, (day.waterMl || 0) + ml);
      saveState();
      render();
      if (ml > 0) showToast(`+${ml} ml Wasser`, '💧');
    }

    function toggleSupp(suppId) {
      const day = getDayData();
      day.supps[suppId] = !day.supps[suppId];
      saveState();
      render();
      const supp = GIRL_SUPPS.find(s => s.id === suppId);
      if (day.supps[suppId] && supp) {
        showToast(`${supp.name} abgehakt!`, '💖');
      }
    }

    function changeD3Caps(delta) {
      const day = getDayData();
      day.d3Caps = Math.min(3, Math.max(1, (day.d3Caps || 1) + delta));
      saveState();
      render();
    }

    function renderScanView() {

    function renderFoodItemsList(list) {
      if (list.length === 0) {
        return `<div class="glass-subtle rounded-2xl p-5 text-center text-xs text-muted">Keine Treffer. Über <span class="text-accent font-extrabold">+ Neu</span> kannst du es selbst anlegen.</div>`;
      }
      return list.map(food => `
        <div class="glass-card p-3 rounded-2xl flex items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-extrabold text-main truncate flex items-center gap-1">
              ${food.name} ${food.gutFriendly ? '<span title="Reizdarmfreundlich" class="text-[10px]">🌿</span>' : ''}
            </div>
            <div class="text-[10px] text-muted font-semibold mt-0.5">
              Pro 100${food.unit}: <span class="text-accent font-bold">${food.kcal} kcal</span> • ${food.p}g P • ${food.kh}g KH • ${food.f}g F • ${food.fib || 0}g B
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <input id="qty_input_${food.id}" type="number" step="any" value="${food.defaultQty}" class="w-14 theme-input rounded-xl py-1.5 px-2 text-center text-xs font-extrabold" />

    function renderFoodListOnly() {
      const container = document.getElementById('foodListContainer');
      if (!container) return;
      const filteredFoods = state.foods.filter(f => {
        const matchesSearch = f.name.toLowerCase().includes(searchFilter.toLowerCase());
        const matchesCat = categoryFilter === 'Alle' || f.cat === categoryFilter;
        return matchesSearch && matchesCat;
      });
      container.innerHTML = renderFoodItemsList(filteredFoods);
    }

    function toggleBarcodeCamera() {
      if (isScanning) stopScanner();
      else startScanner();
    }

    function startScanner() {
      const container = document.getElementById('scannerContainer');
      const btn = document.getElementById('cameraToggleBtn');
      if (!container) return;
      container.classList.remove('hidden');
      isScanning = true;
      if (btn) btn.textContent = 'Kamera stoppen';

      if (typeof Html5Qrcode === 'undefined') {
        showBarcodeStatus('Scanner lädt noch – nutze das EAN-Eingabefeld.');
        return;
      }

      html5QrScanner = new Html5Qrcode('qr-reader');
      html5QrScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 140 } },
        (decodedText) => {
          stopScanner();
          fetchOpenFoodFacts(decodedText);
        },
        () => {}
      ).catch(() => {
        isScanning = false;
        container.classList.add('hidden');
        if (btn) btn.textContent = 'Kamera starten';
        showBarcodeStatus('Kamerazugriff nicht möglich (HTTPS erforderlich). Nutze unten das EAN-Feld.');
      });
    }

    function stopScanner() {
      if (html5QrScanner && isScanning) {
        html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {});
      }
      isScanning = false;
      const container = document.getElementById('scannerContainer');
      const btn = document.getElementById('cameraToggleBtn');
      if (container) container.classList.add('hidden');
      if (btn) btn.textContent = 'Kamera starten';
    }

    function lookupManualBarcode() {
      const code = (document.getElementById('manualBarcodeInput')?.value || '').trim();
      if (!code) return showToast('Bitte EAN eingeben', '⚠️');
      fetchOpenFoodFacts(code);
    }

    function showBarcodeStatus(html) {
      const box = document.getElementById('barcodeStatus');
      if (!box) return;
      box.classList.remove('hidden');
      box.innerHTML = html;
    }

    async function fetchOpenFoodFacts(barcode) {
      showBarcodeStatus(`Suche Barcode <b>${barcode}</b>...`);
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`);
        const data = await res.json();
        if (data.status !== 1 || !data.product) {
          showBarcodeStatus(`Produkt für <b>${barcode}</b> nicht gefunden. Über <b>+ Neu</b> anlegen!`);
          return;
        }
        const p = data.product;
        const nutr = p.nutriments || {};
        const name = (p.product_name_de || p.product_name || 'Gescanntes Produkt') + (p.brands ? ` (${p.brands.split(',')[0]})` : '');
        const kcal = Math.round(nutr['energy-kcal_100g'] || (nutr['energy_100g'] ? nutr['energy_100g'] / 4.184 : 0));
        const protein = Number((nutr['proteins_100g'] || 0).toFixed(1));
        const carbs = Number((nutr['carbohydrates_100g'] || 0).toFixed(1));
        const fat = Number((nutr['fat_100g'] || 0).toFixed(1));
        const fiber = Number((nutr['fiber_100g'] || 0).toFixed(1));

        const newId = 'off_' + barcode;
        const existingIdx = state.foods.findIndex(f => f.id === newId);
        const foodObj = {
          id: newId, name, cat: 'Gescannt & Eigene', unit: 'g', defaultQty: 100, gutFriendly: true,
          kcal, p: protein, kh: carbs, f: fat, fib: fiber,
          micro: {
            ca: Math.round((nutr['calcium_100g'] || 0) * 1000),
            mg: Math.round((nutr['magnesium_100g'] || 0) * 1000),
            fe: Number(((nutr['iron_100g'] || 0) * 1000).toFixed(1)),
            zn: Number(((nutr['zinc_100g'] || 0) * 1000).toFixed(1)),
            b12: Number(((nutr['vitamin-b12_100g'] || 0) * 1000000).toFixed(1)),
            biotin: 0
          }
        };
        if (existingIdx >= 0) state.foods[existingIdx] = foodObj;
        else state.foods.unshift(foodObj);
        saveState();
        renderFoodListOnly();

        showBarcodeStatus(`
          <div class="font-extrabold text-main mb-1">✅ ${name}</div>
          <div class="text-[11px] text-muted mb-2">Pro 100g: ${kcal} kcal • ${protein}g P • ${carbs}g KH • ${fat}g F • ${fiber}g B</div>
          <div class="flex items-center gap-2">
            <input id="scannedAddQty" type="number" value="100" class="w-20 theme-input rounded-xl px-2.5 py-1.5 text-xs font-extrabold text-center" />
            <span class="text-xs text-muted">g</span>
            <button onclick="addFoodEntry('${newId}', document.getElementById('scannedAddQty').value)" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="flex-1 py-1.5 px-3 rounded-xl text-xs font-extrabold text-white">
              Jetzt loggen
            </button>
          </div>
        `);
      } catch {
        showBarcodeStatus('Netzwerkfehler bei Open Food Facts.');
      }
    }

          <section class="space-y-2.5">

        };
      }
      renderPresetEditorContent();
    }

    function saveCurrentDayAsPreset() {
      const day = getDayData();
      if (day.entries.length === 0) return;
      editingPresetDraft = {
        id: 'preset_' + Date.now(),
        name: 'Meine Jause ' + formatDateLabel(state.selectedDate),
        icon: '🎀',
        items: day.entries.map(e => ({ foodId: e.foodId, qty: e.qty }))
      };
      renderPresetEditorContent();
    }

    function renderPresetEditorContent() {
      const icons = ['🥪', '🍓', '🍫', '🥗', '🥞', '🥣', '🍳', '🎀'];
      let totKcal = 0, totP = 0, totKh = 0, totF = 0, totFib = 0;
      editingPresetDraft.items.forEach(it => {
        const n = calcItemNutrition(getFoodById(it.foodId), it.qty);
        totKcal += n.kcal; totP += n.p; totKh += n.kh; totF += n.f; totFib += n.fib;
      });

      const itemsHTML = editingPresetDraft.items.map((it, idx) => {
        const food = getFoodById(it.foodId);
        if (!food) return '';
        return `
          <div class="glass-subtle p-2.5 rounded-2xl flex items-center justify-between gap-2">
            <span class="text-xs font-extrabold text-main truncate flex-1">${food.name}</span>
            <div class="flex items-center gap-1.5">
              <input type="number" step="any" value="${it.qty}" onchange="editingPresetDraft.items[${idx}].qty = Math.max(0.5, parseFloat(this.value)||0); renderPresetEditorContent();" class="w-16 theme-input rounded-xl py-1 px-2 text-center text-xs font-extrabold" />
              <span class="text-[10px] text-muted w-6">${food.unit}</span>
              <button onclick="editingPresetDraft.items.splice(${idx}, 1); renderPresetEditorContent();" class="text-soft hover:text-rose-500 px-1.5 font-bold">✕</button>
            </div>
          </div>
        `;
      }).join('');

      const foodOptions = state.foods.map(f => `<option value="${f.id}">${f.name} (${f.unit})</option>`).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-main">🎀 1-Klick Mahlzeit konfigurieren</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full glass-subtle text-main flex items-center justify-center font-bold">✕</button>
          </div>

          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-muted">Name der Mahlzeit</label>
            <input type="text" value="${editingPresetDraft.name}" oninput="editingPresetDraft.name = this.value" placeholder="z. B. Meine Jause, Pink Skyr Bowl..." class="w-full theme-input rounded-2xl px-3.5 py-2.5 text-xs font-bold" />
          </div>

          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            ${icons.map(ic => `
              <button onclick="editingPresetDraft.icon='${ic}'; renderPresetEditorContent();" class="w-9 h-9 rounded-xl flex items-center justify-center text-lg ${editingPresetDraft.icon === ic ? 'bg-pink-500 text-white shadow-sm' : 'glass-subtle'}">${ic}</button>
            `).join('')}
          </div>

          <div class="glass-card p-3 rounded-2xl flex justify-between text-xs font-extrabold">
            <span class="text-accent">${Math.round(totKcal)} kcal</span>
            <span class="text-emerald-600">${totP.toFixed(1)}g P</span>
            <span class="text-amber-600">${totKh.toFixed(1)}g KH</span>
            <span class="text-rose-500">${totF.toFixed(1)}g F</span>
            <span class="text-pink-600">${totFib.toFixed(1)}g B</span>
          </div>

          <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
            ${itemsHTML || '<div class="text-xs text-muted text-center py-3">Füge unten Zutaten hinzu</div>'}
          </div>

          <div class="flex gap-2 pt-1">
            <select id="presetAddFoodSelect" class="flex-1 theme-input rounded-2xl px-3 py-2.5 text-xs font-bold">
              ${foodOptions}
            </select>
            <button onclick="addIngredientToPresetDraft()" class="px-4 py-2.5 rounded-2xl bg-accent-soft text-accent font-extrabold text-xs border border-pink-400/30 shrink-0">
              + Zutat
            </button>
          </div>

          <button onclick="savePresetDraft()" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="w-full py-3 rounded-2xl text-xs font-extrabold text-white shadow-md">
            Als 1-Klick Mahlzeit speichern
          </button>
        </div>
      `);
    }

    function addIngredientToPresetDraft() {
      const sel = document.getElementById('presetAddFoodSelect');
      const food = getFoodById(sel.value);
      if (!food) return;
      editingPresetDraft.items.push({ foodId: food.id, qty: food.defaultQty });
      renderPresetEditorContent();
    }

    function savePresetDraft() {
      const name = (editingPresetDraft.name || '').trim();
      if (!name) return showToast('Bitte Name eingeben', '⚠️');
      if (editingPresetDraft.items.length === 0) return showToast('Mindestens 1 Zutat wählen', '⚠️');
      const idx = state.presets.findIndex(p => p.id === editingPresetDraft.id);
      if (idx >= 0) state.presets[idx] = editingPresetDraft;
      else state.presets.unshift(editingPresetDraft);
      saveState();
      closeModal();
      render();
      showToast(`"${name}" gespeichert!`, '🎀');
    }

    function deletePreset(presetId) {
      state.presets = state.presets.filter(p => p.id !== presetId);
      saveState();
      render();
      showToast('Vorlage gelöscht', '🗑️');
    }

    function openQuickLogModal() {
      const options = state.foods.map(f => `<option value="${f.id}">${f.name} (${f.kcal} kcal / 100${f.unit})</option>`).join('');
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-main">🍓 Schnell loggen</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full glass-subtle text-main flex items-center justify-center font-bold">✕</button>
          </div>
          <div class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-muted">Lebensmittel wählen</label>
              <select id="quickFoodSel" onchange="const f = getFoodById(this.value); document.getElementById('quickFoodQty').value = f.defaultQty; document.getElementById('quickFoodUnit').textContent = f.unit;" class="w-full mt-1 theme-input rounded-2xl px-3.5 py-3 text-xs font-bold">
                ${options}
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold text-muted">Menge</label>
              <div class="flex items-center gap-2 mt-1">
                <input id="quickFoodQty" type="number" step="any" value="${state.foods[0].defaultQty}" class="flex-1 theme-input rounded-2xl px-3.5 py-2.5 text-sm font-extrabold" />
                <span id="quickFoodUnit" class="text-xs font-bold text-muted px-2">${state.foods[0].unit}</span>
              </div>
            </div>
            <button onclick="addFoodEntry(document.getElementById('quickFoodSel').value, document.getElementById('quickFoodQty').value); closeModal();" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="w-full py-3 rounded-2xl text-xs font-extrabold text-white shadow-md">
              Hinzufügen
            </button>
          </div>
        </div>
      `);
    }

    function openNewFoodModal() {
      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-main">Neues Lebensmittel (pro 100 g/ml)</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full glass-subtle text-main flex items-center justify-center font-bold">✕</button>
          </div>
          <input id="nfName" type="text" placeholder="Name (z. B. Topfen 20 %)" class="w-full theme-input rounded-2xl px-3.5 py-2.5 text-xs font-bold" />
          <div class="grid grid-cols-2 gap-2">
            <div><label class="text-[10px] font-bold text-muted">Kalorien (kcal)</label><input id="nfKcal" type="number" placeholder="0" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-emerald-600">Protein (g)</label><input id="nfP" type="number" step="0.1" placeholder="0" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-amber-600">Kohlenhydrate (g)</label><input id="nfKh" type="number" step="0.1" placeholder="0" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-rose-500">Fett (g)</label><input id="nfF" type="number" step="0.1" placeholder="0" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-extrabold text-accent">Ballaststoffe (g)</label><input id="nfFib" type="number" step="0.1" placeholder="0" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-muted">Standard-Portion (g)</label><input id="nfDef" type="number" value="100" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
          </div>
          <button onclick="saveNewCustomFood()" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="w-full py-3 rounded-2xl text-xs font-extrabold text-white">Speichern</button>
        </div>
      `);
    }

    function saveNewCustomFood() {
      const name = (document.getElementById('nfName').value || '').trim();
      if (!name) return showToast('Name erforderlich', '⚠️');
      state.foods.unshift({
        id: 'custom_' + Date.now(), name, cat: 'Gescannt & Eigene', unit: 'g', gutFriendly: true,
        defaultQty: Number(document.getElementById('nfDef').value) || 100,
        kcal: Number(document.getElementById('nfKcal').value) || 0,
        p: Number(document.getElementById('nfP').value) || 0,
        kh: Number(document.getElementById('nfKh').value) || 0,
        f: Number(document.getElementById('nfF').value) || 0,
        fib: Number(document.getElementById('nfFib').value) || 0,
        micro: { mg: 0, fe: 0, zn: 0, ca: 0, b12: 0, biotin: 0 }
      });
      saveState();
      closeModal();
      render();
      showToast(`${name} angelegt!`, '🎀');
    }

    function openGoalsModal() {
      const g = state.goals[state.goalMode];
      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-main">Ziele (${g.label}) anpassen</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full glass-subtle text-main flex items-center justify-center font-bold">✕</button>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div><label class="text-[10px] font-bold text-muted">Kalorien (kcal)</label><input id="gKcal" type="number" value="${g.kcal}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-emerald-600">Protein (g)</label><input id="gP" type="number" value="${g.p}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-amber-600">Kohlenhydrate (g)</label><input id="gKh" type="number" value="${g.kh}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-rose-500">Fett (g)</label><input id="gF" type="number" value="${g.f}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-extrabold text-accent">Ballaststoffe (g)</label><input id="gFib" type="number" value="${g.fib}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
            <div><label class="text-[10px] font-bold text-sky-600">Wasser (ml)</label><input id="gWater" type="number" value="${g.water}" class="w-full mt-0.5 theme-input rounded-xl px-3 py-2 text-xs font-bold" /></div>
          </div>
          <button onclick="saveGoalMode()" style="background: linear-gradient(135deg, var(--accent), var(--accent-2));" class="w-full py-3 rounded-2xl text-xs font-extrabold text-white">Ziele speichern</button>
        </div>
      `);
    }

    function saveGoalMode() {
      const oldLabel = state.goals[state.goalMode].label;
      state.goals[state.goalMode] = {
        label: oldLabel,
        kcal: Number(document.getElementById('gKcal').value) || 2250,
        p: Number(document.getElementById('gP').value) || 155,
        kh: Number(document.getElementById('gKh').value) || 235,
        f: Number(document.getElementById('gF').value) || 72,
        fib: Number(document.getElementById('gFib').value) || 30,
        water: Number(document.getElementById('gWater').value) || 2750
      };
      saveState();
      closeModal();
      render();
      showToast('Ziele aktualisiert!', '💖');
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kittynutri-backup-${getTodayISO(0)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup gespeichert', '📤');
    }

    function importBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.foods && imported.days) {
            state = imported;
            saveState();
            applyTheme(state.theme);
            render();
            showToast('Backup geladen!', '📥');
          }
        } catch {
          showToast('Fehler beim Laden', '⚠️');
        }
      };
      reader.readAsText(file);
    }

    function render() {
      updateHeaderAndNav();
      const viewport = document.getElementById('appViewport');
      if (state.activeTab === 'today') viewport.innerHTML = renderTodayView();
      else if (state.activeTab === 'cycle') viewport.innerHTML = renderCycleView();
      else if (state.activeTab === 'scan') viewport.innerHTML = renderScanView();
      else if (state.activeTab === 'supps') viewport.innerHTML = renderSuppsView();
      else if (state.activeTab === 'presets') viewport.innerHTML = renderPresetsAndMoreView();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    applyTheme(state.theme);
    render();
  </script>
</body>
</html>
